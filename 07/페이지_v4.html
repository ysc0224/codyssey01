<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코디세이 네이티브 입학연수 설문조사</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f4f7f9;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.6;
        }
        .container {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 10px; }
        p.description { color: #7f8c8d; font-size: 14px; margin-bottom: 30px; }
        
        .form-group { margin-bottom: 25px; }
        .label-text { display: block; font-weight: bold; margin-bottom: 10px; color: #34495e; }
        .required::after { content: ' *'; color: #e74c3c; }
        .optional::after { content: ' (선택)'; color: #95a5a6; font-size: 12px; }

        .options label { display: block; margin-bottom: 8px; cursor: pointer; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            resize: vertical;
            box-sizing: border-box;
            margin-bottom: 5px;
        }
        .char-counter {
            text-align: right;
            font-size: 13px;
            color: #7f8c8d;
        }

        .anonymous-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px dashed #cbd5e0;
        }

        .btn-group { display: flex; gap: 10px; }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit { background-color: #3498db; color: white; }
        .btn-submit:hover { background-color: #2980b9; }
    </style>
</head>
<body>

<div class="container">
    <h1>입학연수 과정 의견 수렴</h1>
    <p class="description">
        코디세이 네이티브 입학연수 과정을 경험하며 느낀 소중한 의견을 들려주세요.<br>
        보내주신 의견은 과정 개선을 위한 소중한 자료로 활용됩니다.
    </p>

    <form id="surveyForm">
        <!-- 1. 체크박스 (수정: 다시 필수 항목으로 변경) -->
        <div class="form-group">
            <span class="label-text required">도움이 되었던 학습 자료를 모두 선택해주세요.</span>
            <div class="options">
                <label><input type="checkbox" name="resource" value="홈페이지"> 코디세이 홈페이지 가이드</label>
                <label><input type="checkbox" name="resource" value="로그인정보"> 로그인 및 계정 관리 정보</label>
                <label><input type="checkbox" name="resource" value="디스코드"> 디스코드 입학연수 관련 자료</label>
                <label><input type="checkbox" name="resource" value="기타"> 기타 참고 문서</label>
            </div>
            <p id="checkbox-error" style="color: #e74c3c; font-size: 12px; display: none; margin-top: 5px;">최소 하나 이상의 항목을 선택해주세요.</p>
        </div>

        <!-- 2. 래디오버튼 (매우 불만족 포함) -->
        <div class="form-group">
            <span class="label-text required">현재까지의 과정 만족도는 어떠신가요?</span>
            <div class="options">
                <label><input type="radio" name="satisfaction" value="매우만족" required> 매우 만족</label>
                <label><input type="radio" name="satisfaction" value="만족"> 만족</label>
                <label><input type="radio" name="satisfaction" value="보통"> 보통</label>
                <label><input type="radio" name="satisfaction" value="불만족"> 불만족</label>
                <label><input type="radio" name="satisfaction" value="매우불만족"> 매우 불만족</label>
            </div>
        </div>

        <!-- 3. 서술형 텍스트 박스 (글자수 카운터 포함) -->
        <div class="form-group">
            <span class="label-text optional">과정 중 가장 인상 깊었던 점이나 개선 제안을 적어주세요.</span>
            <textarea id="feedback" name="feedback" placeholder="자유롭게 작성해주세요."></textarea>
            <div class="char-counter"><span id="charCount">0</span> 자 입력됨</div>
        </div>

        <!-- 익명 설정 -->
        <div class="anonymous-section">
            <label style="cursor: pointer;">
                <input type="checkbox" id="anonymousToggle"> <strong>익명으로 제출하겠습니다.</strong>
            </label>
            <p style="font-size: 12px; color: #666; margin-top: 5px;">체크 시 작성자 정보가 기록되지 않습니다.</p>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn-submit">설문 제출하기</button>
        </div>
    </form>
</div>

<script>
    // 글자수 카운터 기능
    const feedbackTextarea = document.getElementById('feedback');
    const charCountDisplay = document.getElementById('charCount');

    feedbackTextarea.addEventListener('input', function() {
        charCountDisplay.textContent = this.value.length;
    });

    // 폼 제출 처리
    document.getElementById('surveyForm').addEventListener('submit', function(e) {
        // 체크박스 필수 선택 검증
        const checkboxes = document.querySelectorAll('input[name="resource"]:checked');
        const errorMsg = document.getElementById('checkbox-error');
        
        if (checkboxes.length === 0) {
            e.preventDefault(); // 제출 중단
            errorMsg.style.display = 'block';
            alert('도움이 되었던 학습 자료를 최소 하나 이상 선택해주세요.');
            return;
        } else {
            errorMsg.style.display = 'none';
        }

        e.preventDefault();

        const formData = new FormData(this);
        const isAnonymous = document.getElementById('anonymousToggle').checked;
        
        let results = {
            timestamp: new Date().toLocaleString(),
            type: isAnonymous ? "익명" : "기명",
            resources: Array.from(formData.getAll('resource')).join(', '),
            satisfaction: formData.get('satisfaction'),
            feedback: formData.get('feedback').replace(/\n/g, " ") || "내용 없음"
        };

        // CSV 파일 생성 (BOM 추가로 한글 깨짐 방지)
        const csvContent = "\uFEFF" 
            + "제출시간,제출유형,학습자료,만족도,의견\n"
            + `${results.timestamp},${results.type},"${results.resources}",${results.satisfaction},"${results.feedback}"`;

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        
        link.setAttribute("href", url);
        link.setAttribute("download", "survey_result.csv");
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        alert(isAnonymous ? "익명으로 설문이 제출되었습니다!" : "설문이 성공적으로 제출되었습니다!");
    });
</script>

</body>
</html>
